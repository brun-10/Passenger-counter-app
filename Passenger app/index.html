<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passenger app</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="all-container">
    <div class="universal-container">
    <h1 class="title">Passenger app</h1>
    <h1 id="count-value" class="number-value">0</h1>
    <div class="whole-container">
        <button id="increaseId" class="increase-btn" onclick="increase()">Increase</button>
        <button id="decreaseId" class="decrease-btn" onclick="decrease()">Decrease</button>
        <button id="saveId" class="save-btn" onclick="save()">Save</button>
    </div>
    <p id="saved-value" class="saved-value"><b>Entries:</b></p>
    </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
